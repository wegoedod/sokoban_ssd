# AstroDeck 설정 파일 (UTF-8). 값이 잘못되면 기본값으로 대체하고 경고한다.

# 되돌리기 1회당 점수 페널티 (κ)
kappa=10

# 별 기준: ★★★ moves <= ceil(optimal * star3Ratio), ★★ moves <= ceil(optimal * star2Ratio)
star3Ratio=1.2
star2Ratio=1.6

# 난이도 점수 D = sum(w_g * n_g) + alpha*optimalMoves + beta*blockCount + gamma*(kinds-1) + delta*(layers-1)
alpha=1.0
beta=2.0
gamma=3.0
delta=2.0

# 인접 레벨 난이도 급등 한계 (LevelTool 곡선 검사)
maxDeltaD=15

# 기믹별 가중치 w_g (기믹 추가 후 사용)
weight.direction=1.0
weight.stairs=1.0
weight.gravity=1.5
weight.chain=1.5
weight.lift=1.5
weight.portal=2.0
weight.sequence_goal=2.0

# 연쇄 밀기 최대 길이 (연쇄 기믹 추가 후 사용)
maxChain=3
